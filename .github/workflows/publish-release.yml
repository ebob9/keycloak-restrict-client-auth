name: Publish Release

# Fork-only workflow: build an EXISTING (already-pushed, user-signed) tag in CI
# and publish the artifact as a GitHub release. Unlike release.yml, this does
# not run maven-release-plugin, needs no -SNAPSHOT version on main, and never
# creates commits or tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v26.1.3-ebob9)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      - name: Build and test (unit + integration)
        run: mvn -B clean verify
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: "target/keycloak-restrict-client-auth.jar"
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.inputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
